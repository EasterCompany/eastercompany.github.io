name: Publish corporate website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corporate-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/Prd'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/validate.py
      - uses: actions/configure-pages@v5
      # MICROSOFT'S PUBLISHER-DOMAIN PROOF LIVES UNDER A DOT-DIRECTORY. v4 of this action
      # hard-codes `--exclude=".[^/]*"` and does not accept an input to change it: run
      # 40460226775 published the whole site - the hero loop included - and answered 404 at
      # /.well-known/microsoft-identity-association.json, and the downloaded artifact showed
      # no dot-entry at all in its tar listing. v5 is the release that has the input, so the
      # pin moves with it. Nothing else under site/ starts with a dot, so this admits
      # exactly the association file.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
