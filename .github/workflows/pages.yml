name: Publish corporate website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corporate-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/Prd'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/validate.py
      - uses: actions/configure-pages@v5
      # MICROSOFT'S PUBLISHER-DOMAIN PROOF LIVES UNDER A DOT-DIRECTORY. This action
      # excludes every top-level dot-entry by default (it passes `--exclude=.[^/]*` to
      # tar unless told otherwise), so site/.well-known/ was silently dropped from the
      # artifact: the first publish after adding it deployed the whole site and answered
      # 404 at /.well-known/microsoft-identity-association.json - measured 2026-10-27,
      # run 40460226775 succeeded while that URL 404'd and the rest of the tree was live.
      # The domain verification depends on that exact path, so hidden files are included
      # deliberately. Nothing else in site/ starts with a dot.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
