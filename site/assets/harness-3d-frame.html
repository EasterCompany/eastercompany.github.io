*{box-sizing:border-box;transition:background-color .6s ease,border-color .6s ease,color .6s ease}
html,body{margin:0;height:100%;background:var(--page);overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--page)}
#rig{position:absolute;width:1280px;height:720px;transform-origin:0 0}
#cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#desk{position:absolute;inset:-700px;background:var(--bg)}
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--txt)}
#top{height:31px;flex:none;border-bottom:1px solid var(--line);background:var(--bar);display:flex;align-items:center;gap:7px;padding:0 11px;position:relative}
.chip{height:21px;border:1px solid var(--line);border-radius:7px;padding:0 8px;display:flex;align-items:center;gap:6px;font-size:8.5px;color:var(--txt);background:var(--chip);white-space:nowrap}
.chip svg{width:10px;height:10px;color:var(--mut)}
.ou{width:14px;height:14px;border-radius:4px;background:var(--ou);color:#fff;font:600 7px Inter;display:grid;place-items:center;font-style:normal}
.eg{color:var(--pur);font-size:11px;line-height:1;font-weight:600}
.sc{color:var(--mut);letter-spacing:.5px}.sc .w{color:var(--pur)}.sc .d{color:var(--ok)}
.ct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:6.5px;line-height:1.35;color:var(--mut)}.ct b{display:block;color:var(--hd);font-weight:600}
.rt{margin-left:auto;display:flex;gap:6px;align-items:center}
.ib{width:21px;height:21px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;color:var(--txt);background:var(--chip)}.ib svg{width:10px;height:10px}
#cols{flex:1;min-height:0;display:flex}
#side{width:280px;flex:none;border-right:1px solid var(--line);background:var(--side);padding:12px 9px;overflow:hidden}
.ih{display:flex;align-items:center;gap:7px;margin:2px 6px 10px;font-size:10px;color:var(--hd)}.ih b{font-weight:600}.ih svg{width:11px;height:11px;color:var(--mut)}
#side h5{margin:12px 0 5px 7px;font-size:7.5px;color:var(--mut);font-weight:600}
.ag{display:flex;align-items:center;gap:8px;height:37px;padding:0 8px;border-radius:8px}.ag.sel{background:var(--sel)}
.ag .a{position:relative;width:21px;height:21px;border-radius:50%;flex:none}
.ag .a::after{content:"";position:absolute;right:-2px;bottom:-2px;width:7px;height:7px;border-radius:50%;background:#22c55e;border:1.5px solid var(--side)}
.ag.sel .a::after{background:#e8e8ee;border-color:var(--sel)}.ag.off .a::after{background:#ef4444}.ag.off{opacity:.55}
.ag b{display:block;font-size:9.5px;color:var(--n1);font-weight:500}.ag small{display:block;font-size:8px;color:var(--mut)}
.ag em{margin-left:auto;font-style:normal;color:var(--mut);font-size:9px;letter-spacing:1px}
.cn{display:flex;align-items:center;gap:6px;height:25px;margin-left:18px;padding:0 6px;border-left:1px solid var(--cnl);opacity:0;transform:translateX(-6px);transition:opacity .5s,transform .5s}
.cn.on{opacity:1;transform:none}.cn .a{width:14px;height:14px;border-radius:50%;flex:none}
.cn.wk .a{animation:cp 1.6s ease-out infinite}@keyframes cp{0%{box-shadow:0 0 0 0 var(--glow)}70%,100%{box-shadow:0 0 0 5px transparent}}
.cn b{font-size:8.5px;font-weight:500;color:var(--n2)}.cn small{margin-left:auto;font-size:7.5px;color:var(--mut)}.cn small.w{color:var(--pur)}.cn small.ok{color:var(--ok)}
#main{flex:1;display:flex;justify-content:center;min-width:0;padding:0 0 10px}
#col{width:520px;display:flex;flex-direction:column}
#feed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 14%);mask-image:linear-gradient(transparent,#000 14%)}
.r{display:none;align-items:center;gap:6px;height:27px;flex:none;font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden}
.r b{color:var(--lab);font-weight:500}.r i{font-style:normal;opacity:.6}.r span{overflow:hidden;text-overflow:ellipsis}
.r svg{width:10px;height:10px;flex:none;color:var(--ic)}.r u{color:var(--lk)}
.r.sp b{color:var(--spb)}.r.sp svg{color:var(--pur)}
.r.t{display:none;height:auto;white-space:normal;margin:7px 0;font-size:11.5px;line-height:1.6;color:var(--big)}
code{font:400 .88em ui-monospace,Menlo,monospace;background:var(--code);color:var(--codet);padding:1px 4px;border-radius:4px}
.in{animation:ri .45s cubic-bezier(.2,.7,.2,1)}@keyframes ri{from{opacity:0;transform:translateY(10px)}}
#wk{height:26px;display:flex;align-items:center;gap:6px;font-size:9px;color:var(--mut)}#wk b{color:var(--pur);font-weight:500}
#cmp{position:relative;height:58px;border-radius:12px;background:var(--cmp);border:1px solid var(--cmpl);padding:11px 14px}
#cmp .ph{font-size:11px;color:var(--phc);white-space:nowrap}#cmp .ph.ty{color:var(--big)}
#cmp .ph::after{content:"";display:inline-block;width:1px;height:11px;background:var(--pur);margin-left:1px;vertical-align:-2px;animation:cb 1s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
