<!--
  AGENT HARNESS HERO LOOP — the background animation on easter.company and on the
  e-server Billing page. It is decoration: aria-hidden, no pointer events, no controls.

  ── THE THEME CONTRACT (the one way this file is told which palette to paint) ──────
  THE ARTWORK IS v3.1 (Owen, 2026-10-30). Against v2.0 a viewer sees exactly two
  differences: the four agents carry their own portraits (data URIs in AV, so the
  inbox rows, the swarm clones and the channel rows draw faces instead of gradient
  discs), and a channel row overlays its two members' portraits through pair().
  v3.1's two palettes are Owen's values, carried over unchanged; its own Dark/Light
  control, the hash handling and the storage behind it are gone — see below.

  The palette is NEVER chosen here and NEVER stored here. The host page owns the
  person's Theme setting — e-server keeps `easter.settings.theme` and mirrors it into
  document.documentElement.dataset.theme, easter.company keeps the account's saved
  settings document behind the shared account control — and hands the PREFERENCE down
  in one of two ways:

  1. THE URL, so a cold load paints correctly with no flash:
         hero-loop.html?theme=light|dark|system
     Absent or unrecognised means `system`.
  2. THE MESSAGE, for every change after load (a settings change, another tab, a
     preview) — sent to this iframe's contentWindow:
         {type: 'hero-theme', theme: 'light' | 'dark' | 'system'}
     Accepted only from `window.parent` and only from an origin in PARENT_ORIGINS
     below (this frame's own origin, which is how both products serve it, plus the
     Easter Company site origins). Anything else is ignored, including a `theme`
     value outside those three.

  `system` is resolved HERE, through prefers-color-scheme, and repaints live when the
  OS changes; an explicit `light` or `dark` is never overridden by the media query.
  There is NO storage in this file (no localStorage, no sessionStorage, no cookie), so
  a stray `ahh-theme` key cannot override the account's setting, and there is no
  Dark/Light control in the markup: this is a background, and its job is to look like
  whatever the person chose.
-->
<script>(function(){
 var THEMES={light:1,dark:1,system:1};
 var PARENT_ORIGINS=[location.origin,'https://easter.company','https://www.easter.company',
  'https://launcher.easter.company','https://eastercompany.github.io'];
 var root=document.documentElement,preference='system';
 var media=matchMedia('(prefers-color-scheme: light)');
 function paint(){root.setAttribute('data-theme',preference==='system'?(media.matches?'light':'dark'):preference)}
 try{var asked=new URLSearchParams(location.search).get('theme');if(asked&&THEMES[asked])preference=asked}catch(e){}
 paint();
 if(media.addEventListener)media.addEventListener('change',paint);
 else if(media.addListener)media.addListener(paint);
 addEventListener('message',function(event){
  if(PARENT_ORIGINS.indexOf(event.origin)<0||event.source!==parent)return;
  var data=event.data;
  if(!data||data.type!=='hero-theme'||!THEMES[data.theme])return;
  preference=data.theme;paint();
 });
})()</script>
